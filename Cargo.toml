[package]
name = "graphify-plugin-opendoc"
version = "0.1.0"
edition = "2021"
description = "Graphify plugin: doc-code bidirectional traceability and drift audit"

[lib]
name = "graphify_plugin_opendoc"
path = "src/lib.rs"

[dependencies]
graphify-core = { path = "../../GraphifyRust/graphify-core" }
graphify-registry = { path = "../../GraphifyRust/graphify-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
# ponytail: 預設關閉 tls（OD 本機 http://127.0.0.1:3006）；需要 https 時加 "tls" feature。
ureq = { version = "2", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"