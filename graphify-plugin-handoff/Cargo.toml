[package]
name = "graphify-plugin-handoff"
version = "0.1.0"
edition = "2021"
description = "Graphify plugin: cross-session / cross-repo agent state relay (Code Relay handoff)"

[lib]
name = "graphify_plugin_handoff"
path = "src/lib.rs"

[[bin]]
name = "handoff-cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = []

[dependencies]
graphify-core = { path = "../../GraphifyRust/graphify-core" }
graphify-registry = { path = "../../GraphifyRust/graphify-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
sha1 = "0.10"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

